<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Dark Mode</title>
  <style>
    /* Base styling */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background-color: #f4f4f4;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      transition: background-color 0.5s, color 0.5s;
    }

    /* Dark mode styling */
    body.dark-mode {
      background-color: #000;
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    p {
      margin-top: 10px;
      font-size: 18px;
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-top: 20px;
      object-fit: cover;
      background-color: #ccc; /* placeholder color */
    }

    button {
      padding: 10px 20px;
      font-size: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background-color: black;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
    }

    button:hover {
      background-color: white;
      color: black;
    }
  </style>
</head>
<body>
  <h1>Arnians</h1>
  <p>Lagom or Itom?</p>
  
  <button onclick="toggleDarkMode()">Toggle Dark Mode</button>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }
  </script>
</body>
</html>
